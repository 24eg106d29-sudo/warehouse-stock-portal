<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Warehouse Stock Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Warehouse Stock Portal</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="stock.html">Stock</a>
            <a href="reports.html">Reports</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Contact Warehouse Administration</h2>
        <p>Have a question about stock availability? Send us a message.</p>

        <form id="contactForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" required>

            <label for="message">Message</label>
            <textarea id="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <p id="response"></p>
    </main>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("response").textContent =
                "Thank you! Your message has been recorded in this demo.";

            this.reset();
        });
    </script>

</body>
</html>
